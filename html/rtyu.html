<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Container styling */
.nav-container {
    position: relative;
    display: inline-block;
}

/* Sandwich icon */
.menu-icon {
    width: 40px;
    cursor: pointer;
}

/* Hide menu by default */
.main-menu {
    display: none;
    position: absolute;
    top: 50px; /* just below the sandwich image */
    left: 0;
    background: rgba(255, 255, 255, 0.9);
    list-style: none;
    padding: 10px;
    margin: 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* Show menu when hovering over sandwich */
.nav-container:hover .main-menu {
    display: block;
}

/* Main menu items */
.main-menu > li {
    padding: 8px 12px;
    cursor: pointer;
    position: relative;
}

.main-menu > li:hover {
    background: #f0f0f0;
}

/* Submenu hidden by default */
.submenu {
    display: none;
    position: absolute;
    left: 100%;
    top: 0;
    background: rgba(255, 255, 255, 0.95);
    list-style: none;
    padding: 8px;
    margin: 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* Show submenu when hovering parent */
.has-submenu:hover .submenu {
    display: block;
}

/* Submenu items */
.submenu li {
    padding: 6px 10px;
    cursor: pointer;
}

.submenu li:hover {
    background: #e0e0e0;
}

    </style>
</head>
<body>
    <div class="nav-container">
    <img src="../images/sandwich.png" alt="Menu" class="menu-icon">
    <ul class="main-menu">
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
        <li>Pricing</li>
        <li>FAQ</li>
        <li class="has-submenu">Blog
            <ul class="submenu">
                <li>Blog Home</li>
                <li>Blog Post</li>
            </ul>
        </li>
        <li class="has-submenu">Portfolio
            <ul class="submenu">
                <li>Portfolio Overview</li>
                <li>Portfolio Post</li>
            </ul>
        </li>
    </ul>
</div>

</body>
</html>
